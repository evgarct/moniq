name: moniq-forecast

services:
  forecast:
    build: .
    image: moniq-forecast:local
    container_name: moniq-forecast
    restart: unless-stopped
    env_file: .env
    environment:
      HF_HOME: /models
    volumes:
      - hf_cache:/models
    mem_limit: 2g
    cpus: 2
    # No published ports: Caddy reaches the container over the shared edge network.
    networks:
      - edge

volumes:
  hf_cache:

networks:
  edge:
    external: true
    name: moniq-forecast-edge
